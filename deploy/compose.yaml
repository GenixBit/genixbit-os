services:
  caddy:
    image: caddy:2-alpine
    container_name: genixbit-os-web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-127.0.0.1:8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../website/os:/srv/os:ro
      - ../website/docs:/srv/docs:ro
      - ../website/packages:/srv/packages:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run

volumes:
  caddy_data:
  caddy_config:

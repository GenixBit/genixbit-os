name: 0.3.0-alpha Candidate Validation Gate

on:
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: 'Frozen candidate branch'
        required: true
        default: 'validation/0.3.0-alpha-candidate-2'
      candidate_sha:
        description: 'Full 40-character candidate commit SHA'
        required: true
      target_version:
        description: 'Target Release Version (e.g. 0.3.0-alpha)'
        required: true
        default: '0.3.0-alpha'

permissions:
  contents: read

concurrency:
  group: genixbit-0.3.0-release-gate
  cancel-in-progress: false

jobs:
  release-gate-validation:
    name: Candidate Validation Gate
    runs-on:
      - self-hosted
      - linux
      - x64
      - genixbit-release-gate
    environment:
      name: release-validation
    timeout-minutes: 360

    env:
      STAGING_SIGNING_PASSPHRASE: ${{ secrets.STAGING_SIGNING_PASSPHRASE }}
      GENIXBIT_STAGING_SERVER: ${{ vars.GENIXBIT_STAGING_SERVER }}
      ACTIVE_RELEASE_VERSION: 0.3.0-alpha
      ACTIVE_RELEASE_MODE: fresh-install-only
      ACTIVE_RELEASE_PROVENANCE_FILE: docs/releases/0.3.0-alpha-artifact.json
      ACTIVE_RELEASE_ISO_URL: ${{ vars.ACTIVE_RELEASE_ISO_URL }}
      ACTIVE_RELEASE_SOURCE_COMMIT: ${{ inputs.candidate_sha }}
      EXPECTED_CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
      EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}


    steps:
      - name: Clean stale root-owned build artifacts
        run: |
          # build.sh (debootstrap) may leave root-owned new_building_os/ from previous runs.
          # Remove it with sudo before checkout so git can clean the workspace.
          sudo rm -rf new_building_os/ || true

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}

      - name: Verify frozen candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.candidate_branch }}' == 'validation/0.3.0-alpha-candidate-2' ]]
          [[ '${{ inputs.target_version }}' == '0.3.0-alpha' ]]
          [[ '${{ inputs.candidate_sha }}' =~ ^[0-9a-f]{40}$ ]]
          git fetch origin '${{ inputs.candidate_branch }}:${{ inputs.candidate_branch }}'
          branch_sha=$(git rev-parse '${{ inputs.candidate_branch }}')
          [[ "$branch_sha" == '${{ inputs.candidate_sha }}' ]]
          [[ "$(git rev-parse HEAD)" == '${{ inputs.candidate_sha }}' ]]
          git switch -C '${{ inputs.candidate_branch }}' '${{ inputs.candidate_sha }}'
          [[ "$(git symbolic-ref --quiet --short HEAD)" == '${{ inputs.candidate_branch }}' ]]
          [[ "$(git rev-parse HEAD)" == '${{ inputs.candidate_sha }}' ]]

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          echo "=== Installing ISO Build Dependencies ==="
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-efi-amd64-bin \
            grub-pc-bin \
            grub-common \
            mtools \
            python3-jsonschema
          echo "[PASS] Build dependencies installed."

      - name: Preflight System, Hardware, & Dependency Verification
        run: |
          set -euo pipefail
          bash tools/validation/run-release-preflight.sh

      - name: Regression Test — Verify No Fabricated Evidence Patterns
        run: |
          set -euo pipefail
          bash tools/validation/test-release-evidence-integrity.sh
          bash tools/validation/test-observed-guest-negative.sh
          bash tools/validation/test-iso-structure.sh
          bash tools/validation/test-release-preflight-evidence.sh
          bash tools/validation/test-candidate2-retirement.sh
          bash tools/validation/test-active-release-artifact.sh
          bash tools/validation/test-candidate-validation-gate.sh
          bash tests/infrastructure/test-qmp-json-parsing.sh
          bash tests/infrastructure/test-candidate2-failure-evidence.sh
          bash tests/infrastructure/test-mksquashfs-runner.sh
          echo "[PASS] Regression tests passed — no fabricated evidence patterns detected."

      - name: Execute Full Package Migration & Staging Validation Suite
        env:
          EXECUTE_REAL_ISO_BUILD: "true"
          EXECUTE_REAL_VM_TESTS: "true"
          EXECUTE_REAL_CLIENT_INSTALL: "true"
          EXECUTE_REAL_MIGRATION: "false"
          ACTIVE_RELEASE_VERSION: "0.3.0-alpha"
          ACTIVE_RELEASE_MODE: "fresh-install-only"
          ACTIVE_RELEASE_PROVENANCE_FILE: "docs/releases/0.3.0-alpha-artifact.json"
          ACTIVE_RELEASE_SOURCE_COMMIT: "${{ inputs.candidate_sha }}"
          EXPECTED_CANDIDATE_BRANCH: "${{ inputs.candidate_branch }}"
          EXPECTED_CANDIDATE_SHA: "${{ inputs.candidate_sha }}"
          GENIXBIT_STAGING_SERVER: "${{ vars.GENIXBIT_STAGING_SERVER || 'http://staging-packages.os.genixbit.internal' }}"
          STAGING_SIGNING_PASSPHRASE: "${{ secrets.STAGING_SIGNING_PASSPHRASE }}"
        run: |
          set -euo pipefail
          EXECUTE_REAL_ISO_BUILD=true \
          EXECUTE_REAL_VM_TESTS=true \
          EXECUTE_REAL_CLIENT_INSTALL=true \
          EXECUTE_REAL_MIGRATION=false \
          ACTIVE_RELEASE_VERSION=0.3.0-alpha \
          ACTIVE_RELEASE_MODE=fresh-install-only \
          ACTIVE_RELEASE_PROVENANCE_FILE=docs/releases/0.3.0-alpha-artifact.json \
          ACTIVE_RELEASE_SOURCE_COMMIT='${{ inputs.candidate_sha }}' \
          EXPECTED_CANDIDATE_BRANCH='${{ inputs.candidate_branch }}' \
          EXPECTED_CANDIDATE_SHA='${{ inputs.candidate_sha }}' \
          bash tools/validation/validate-package-migration.sh

      - name: Validate Release Gate Integrity
        run: |
          bash tools/validation/check-release-gate.sh \
            --gate-file infra/package-staging/results/current/0.3.0-alpha-release-gate.json \
            --provenance-file infra/package-staging/results/current/0.3.0-alpha-artifact.json

      - name: Upload Private Release Gate Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genixbit-release-gate-evidence
          path: |
            infra/package-staging/results/stage-logs/**
            infra/package-staging/results/current/**
            infra/package-staging/results/runtime/**
            infra/package-staging/results/builds/build-a-build.json
            infra/package-staging/results/builds/build-a.env
            infra/package-staging/results/builds/build-a-build.stdout.log
            infra/package-staging/results/builds/build-a-build.stderr.log
            infra/package-staging/results/builds/build-b-build.json
            infra/package-staging/results/builds/build-b.env
            infra/package-staging/results/builds/build-b-build.stdout.log
            infra/package-staging/results/builds/build-b-build.stderr.log
            infra/package-staging/results/builds/build-a-iso-structure.stdout.log
            infra/package-staging/results/builds/build-a-iso-structure.stderr.log
            infra/package-staging/results/builds/build-b-iso-structure.stdout.log
            infra/package-staging/results/builds/build-b-iso-structure.stderr.log
            infra/package-staging/results/builds/build-a-GenixBitOS-0.3.0-alpha-*.iso
            !infra/package-staging/results/runtime/**/id_*
            !infra/package-staging/results/runtime/**/*.key
            !infra/package-staging/results/runtime/**/*private*
          if-no-files-found: error
          retention-days: 90

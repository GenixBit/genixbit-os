name: Operator-Controlled Release Gate Execution

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target Release Version (e.g. 0.3.0-alpha)'
        required: true
        default: '0.3.0-alpha'

permissions:
  contents: read

jobs:
  release-gate-validation:
    name: Operator-Controlled Release Gate Execution
    runs-on:
      - self-hosted
      - linux
      - x64
      - genixbit-release-gate
    environment: release-validation

    env:
      STAGING_SIGNING_PASSPHRASE: ${{ secrets.STAGING_SIGNING_PASSPHRASE }}
      GENIXBIT_STAGING_SERVER: ${{ vars.GENIXBIT_STAGING_SERVER }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight System & Hardware Environment Verification
        run: |
          set -euo pipefail
          echo "=== Executing Operator Release Gate Preflight Checks ==="

          # 1. Hardware Virtualization (/dev/kvm rw)
          if [[ ! -e /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "[FAIL] Hardware virtualization /dev/kvm is missing or not readable/writable." >&2
            exit 1
          fi

          # 2. Required Command Binaries
          req_binaries=(qemu-system-x86_64 qemu-img xorriso mksquashfs unsquashfs gpg gpgv jq curl)
          for b in "${req_binaries[@]}"; do
            if ! command -v "$b" >/dev/null 2>&1; then
              echo "[FAIL] Required preflight binary missing: $b" >&2
              exit 1
            fi
          done

          # isoinfo (optional check where available)
          if command -v isoinfo >/dev/null 2>&1; then
            echo "[PASS] isoinfo binary available."
          fi

          # 3. Firmware check (OVMF & SeaBIOS)
          if [[ ! -f /usr/share/OVMF/OVMF_CODE.fd && ! -f /usr/share/ovmf/OVMF.fd && ! -f /usr/share/qemu/ovmf-x86_64-code.bin && ! -f /usr/share/OVMF/OVMF_CODE_4M.fd ]]; then
            echo "[FAIL] OVMF UEFI firmware image missing!" >&2
            exit 1
          fi

          if [[ ! -f /usr/share/seabios/bios.bin && ! -f /usr/share/qemu/bios-256k.bin && ! -f /usr/share/seabios/bios-256k.bin ]]; then
            echo "[FAIL] SeaBIOS legacy firmware image missing!" >&2
            exit 1
          fi

          # 4. Available Disk Space (Minimum 40 GB = 41,943,040 KB)
          avail_kb=$(df -k . | awk 'NR==2 {print $4}')
          if (( avail_kb < 41943040 )); then
            echo "[FAIL] Insufficient disk space for ISO build & VM testing (found ${avail_kb} KB, required >= 40GB)." >&2
            exit 1
          fi

          # 5. Available Memory (Minimum 8 GB = 8,388,608 KB)
          free_mem_kb=$(grep MemAvailable /proc/meminfo | awk '{print $2}' || awk 'NR==2 {print $4}' <(free -k))
          if (( free_mem_kb < 8388608 )); then
            echo "[FAIL] Insufficient available RAM (found ${free_mem_kb} KB, required >= 8GB)." >&2
            exit 1
          fi

          # 6. Protected Secrets Verification
          if [[ -z "${STAGING_SIGNING_PASSPHRASE:-}" ]]; then
            echo "[FAIL] Protected secret STAGING_SIGNING_PASSPHRASE is empty or unmapped!" >&2
            exit 1
          fi

          # 7. Staging Hostname and Connectivity Verification (Fatal on failure)
          if [[ -z "${GENIXBIT_STAGING_SERVER:-}" ]]; then
            echo "[FAIL] GENIXBIT_STAGING_SERVER variable is empty or unconfigured!" >&2
            exit 1
          fi

          echo "Pinging staging server: $GENIXBIT_STAGING_SERVER"
          if ! curl --silent --head --fail "$GENIXBIT_STAGING_SERVER" >/dev/null 2>&1; then
            echo "[FAIL] Staging server $GENIXBIT_STAGING_SERVER is unreachable or returned non-200 status!" >&2
            exit 1
          fi

          staging_meta_url="${GENIXBIT_STAGING_SERVER}/dists/resolute-alpha/Release"
          if ! curl --silent --head --fail "$staging_meta_url" >/dev/null 2>&1; then
            echo "[FAIL] Staging repository metadata endpoint $staging_meta_url is unreachable!" >&2
            exit 1
          fi

          # 8. Candidate 2 ISO Source Verification
          cand2_url="${GENIXBIT_STAGING_SERVER}/iso/GenixBitOS-0.2.0-alpha-2607220558.iso"
          cand2_local="dist/GenixBitOS-0.2.0-alpha-2607220558.iso"
          if ! [[ -f "$cand2_local" ]] && ! curl --silent --head --fail "$cand2_url" >/dev/null 2>&1; then
            echo "[FAIL] Candidate 2 ISO source is unconfigured or unreachable!" >&2
            exit 1
          fi

          echo "[PASS] All preflight system, hardware, network, and secret requirements verified."

      - name: Execute Full Package Migration & Staging Validation Suite
        run: |
          set -euo pipefail
          EXECUTE_REAL_ISO_BUILD=true EXECUTE_REAL_VM_TESTS=true EXECUTE_REAL_CLIENT_INSTALL=true EXECUTE_REAL_MIGRATION=true bash tools/validation/validate-package-migration.sh

      - name: Validate Release Gate Integrity
        run: |
          bash tools/validation/check-release-gate.sh

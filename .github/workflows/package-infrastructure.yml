name: Package Infrastructure Validation

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'test/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-package-infrastructure:
    name: Package Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install ShellCheck, GnuPG, APT and Packaging tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck jq gnupg gpgv apt-utils dpkg-dev devscripts lintian python3-jsonschema squashfs-tools xorriso mtools

      - name: Validate shell syntax for repository tooling
        run: |
          bash -n tools/repository/lib/safety.sh
          bash -n tools/repository/*.sh
          bash -n tests/repository/*.sh

      - name: Run ShellCheck on repository tooling & tests
        run: |
          shellcheck -e SC1091 tools/repository/lib/safety.sh
          shellcheck -e SC1091 tools/repository/*.sh
          shellcheck -e SC1091 tests/repository/*.sh

      - name: Test path safety library rules
        run: bash tests/repository/test-path-safety.sh

      - name: Run negative security tests
        run: |
          set -eo pipefail
          bash tests/repository/test-negative-security.sh 2>&1 | tee negative_security.log
          grep -q "TAMPERED_METADATA_REJECTED=PASS" negative_security.log

      - name: Run end-to-end signed repository lifecycle test
        run: bash tests/repository/test-signed-repository-lifecycle.sh

      - name: Inspect Docker environment and pull Ubuntu 26.04
        run: |
          docker version
          docker pull ubuntu:26.04
          docker image inspect ubuntu:26.04 | jq -r '.[0].RepoDigests[]' || true

      - name: Run disposable APT client container test and verify evidence markers
        run: |
          set -eo pipefail
          bash tests/repository/test-disposable-apt-client.sh 2>&1 | tee disposable_test.log
          grep -q "DISPOSABLE_APT_UPDATE=PASS" disposable_test.log
          grep -q "DISPOSABLE_APT_INSTALL=PASS" disposable_test.log
          grep -q "DISPOSABLE_APT_UPGRADE=PASS" disposable_test.log
          grep -q "PROMOTION_APT_VALIDATION=PASS" disposable_test.log
          grep -q "SNAPSHOT_VALIDATION=PASS" disposable_test.log
          grep -q "ROLLBACK_APT_VALIDATION=PASS" disposable_test.log

      - name: Validate JSON manifest schemas
        run: jq . docs/schemas/*.json

      - name: Verify absence of committed private keys or secrets
        run: |
          if find . -type f \( -name "*.pem" -o -name "*.key" -o -name "*.sec" -o -name "secring.gpg" \) -not -path "./.git/*" | grep .; then
            echo "Error: Detected committed private key file!" >&2
            exit 1
          fi

      - name: Verify absence of tracked build artifacts (.deb, .dsc, .key, .pgp)
        run: |
          if git ls-files | grep -E '\.(deb|dsc|changes|buildinfo|key|sec|pem)$'; then
            echo "Error: Detected tracked build artifacts in git repository!" >&2
            exit 1
          fi

      # Keep each release-gate regression isolated so CI identifies the exact
      # broken contract instead of reporting one opaque aggregate preflight.
      - name: Test QMP JSON parsing
        run: bash tests/infrastructure/test-qmp-json-parsing.sh

      - name: Test Candidate 2 failure evidence
        run: bash tests/infrastructure/test-candidate2-failure-evidence.sh

      - name: Test mksquashfs runner compatibility
        run: bash tests/infrastructure/test-mksquashfs-runner.sh

      - name: Test ISO structure validation
        run: bash tools/validation/test-iso-structure.sh

      - name: Test release preflight evidence
        run: bash tools/validation/test-release-preflight-evidence.sh

      - name: Test Candidate 2 retirement behavior
        run: bash tools/validation/test-candidate2-retirement.sh

      - name: Test active release artifact behavior
        run: bash tools/validation/test-active-release-artifact.sh

      - name: Test candidate validation gate behavior
        run: bash tools/validation/test-candidate-validation-gate.sh

      - name: Compile candidate gate generator
        run: python3 -m py_compile tools/validation/generate-candidate-gate.py

      - name: Test candidate validation execution
        run: bash tools/validation/test-candidate-validation-execution.sh

      - name: Validate retired Candidate 2 documentation claims
        run: python3 tools/validation/check-retired-candidate-claims.py

      - name: Test retired Candidate 2 documentation claim checker
        run: bash tools/validation/test-retired-candidate-claims.sh

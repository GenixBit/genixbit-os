<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GenixBit OS — Live Cloud Desktop (noVNC)</title>
  <meta name="description" content="Live interactive GenixBit OS cloud desktop session powered by QEMU KVM and noVNC WebSocket streaming.">
  <style>
    :root {
      --bg: #070d18;
      --topbar-bg: rgba(13, 23, 40, 0.95);
      --border: rgba(82, 217, 255, 0.2);
      --cyan: #52d9ff;
      --green: #4ade80;
      --yellow: #facc15;
      --red: #f87171;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }
    #topbar {
      height: 48px;
      background: var(--topbar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .brand span { color: var(--cyan); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--yellow);
      display: inline-block;
    }
    .dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.connecting { background: var(--yellow); animation: pulse 1.5s infinite; }
    .dot.disconnected { background: var(--red); }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: rgba(82, 217, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(82, 217, 255, 0.2);
      color: #fff;
      border-color: var(--cyan);
    }
    .btn.primary {
      background: var(--cyan);
      color: #070d18;
      border: 0;
    }
    .btn.primary:hover {
      background: #7ae1ff;
    }
    #viewport {
      width: 100%;
      height: calc(100% - 48px);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #vncCanvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #overlayMessage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(13, 23, 40, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 440px;
      z-index: 50;
    }
    #overlayMessage h3 {
      font-size: 18px;
      color: #fff;
    }
    #overlayMessage p {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.5;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(82, 217, 255, 0.2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Clipboard Modal */
    #clipModal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--topbar-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      width: 360px;
      z-index: 200;
      box-shadow: 0 16px 48px rgba(0,0,0,0.8);
    }
    #clipModal textarea {
      width: 100%;
      height: 100px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      margin: 10px 0;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      GenixBit OS <span>Cloud VNC</span>
      <div class="status-badge">
        <span id="statusDot" class="dot connecting"></span>
        <span id="statusText">Connecting to GCP Stream...</span>
      </div>
    </div>
    <div class="controls">
      <button class="btn" onclick="sendCtrlAltDel()">Ctrl+Alt+Del</button>
      <button class="btn" onclick="toggleClipboard()">📋 Clipboard</button>
      <button class="btn" onclick="toggleScaling()" id="scaleBtn">↔ Scale: Fit</button>
      <button class="btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
      <button class="btn primary" onclick="reconnect()">🔄 Reconnect</button>
    </div>
  </div>

  <div id="viewport">
    <canvas id="vncCanvas" width="1280" height="720"></canvas>
    
    <div id="overlayMessage">
      <div class="spinner" id="overlaySpinner"></div>
      <h3 id="overlayTitle">Connecting to Live Server...</h3>
      <p id="overlayDesc">Establishing encrypted WebSocket tunnel (<code>wss://os.genixbit.com/websockify</code>) to GCP QEMU/KVM virtual machine instance.</p>
      <button class="btn primary" id="overlayActionBtn" style="display:none;" onclick="reconnect()">Retry Connection</button>
    </div>
  </div>

  <!-- Clipboard Modal -->
  <div id="clipModal">
    <h4 style="font-size:15px; color:#fff;">Send Text to Cloud OS</h4>
    <textarea id="clipText" placeholder="Type or paste text to send into the GenixBit OS VM..."></textarea>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button class="btn" onclick="toggleClipboard()">Cancel</button>
      <button class="btn primary" onclick="sendClipboardText()">Send to VM</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const autoconnect = urlParams.get('autoconnect') !== 'false';
    const wsPath = urlParams.get('path') || 'websockify';
    const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsHost = window.location.host;
    const wsUrl = `${proto}//${wsHost}/${wsPath}`;

    const canvas = document.getElementById('vncCanvas');
    const ctx = canvas.getContext('2d');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const overlay = document.getElementById('overlayMessage');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const overlaySpinner = document.getElementById('overlaySpinner');
    const overlayBtn = document.getElementById('overlayActionBtn');

    let ws = null;
    let isConnected = false;
    let scaleMode = 'fit'; // 'fit' or 'original'

    // Interactive fallback simulator renderer for when remote VM is starting
    function renderFallbackDesktop() {
      const w = canvas.width;
      const h = canvas.height;
      
      // Wallpaper background
      const grad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, w);
      grad.addColorStop(0, '#0f2038');
      grad.addColorStop(1, '#050a14');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Top Menu Bar
      ctx.fillStyle = 'rgba(7, 13, 24, 0.85)';
      ctx.fillRect(0, 0, w, 32);
      ctx.fillStyle = 'rgba(82, 217, 255, 0.2)';
      ctx.fillRect(0, 31, w, 1);

      ctx.fillStyle = '#52d9ff';
      ctx.font = 'bold 13px -apple-system, sans-serif';
      ctx.fillText('⚡ GenixBit OS 1.0.0 LTS (Foundation)', 16, 21);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillText('Applications', 260, 21);
      ctx.fillText('Terminal', 350, 21);
      ctx.fillText('AI Studio', 420, 21);
      ctx.fillText('Cloud: GCP us-central1', w - 160, 21);

      // Center Desktop Banner
      ctx.fillStyle = 'rgba(13, 23, 40, 0.8)';
      ctx.strokeStyle = 'rgba(82, 217, 255, 0.3)';
      ctx.lineWidth = 1;
      ctx.roundRect ? ctx.roundRect(w/2 - 240, h/2 - 120, 480, 240, 12) : ctx.rect(w/2 - 240, h/2 - 120, 480, 240);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GenixBit OS 1.0.0 LTS Live Stream', w/2, h/2 - 70);

      ctx.fillStyle = '#94a3b8';
      ctx.font = '13.5px -apple-system, sans-serif';
      ctx.fillText('Local AI Proxy • Zero Telemetry • Multi-Vendor GPU', w/2, h/2 - 35);
      ctx.fillText('QEMU KVM Hypervisor Active on Google Cloud', w/2, h/2 - 10);

      ctx.fillStyle = 'rgba(82, 217, 255, 0.15)';
      ctx.fillRect(w/2 - 200, h/2 + 25, 400, 40);
      ctx.fillStyle = '#52d9ff';
      ctx.font = '13px monospace';
      ctx.fillText('$ genixbit-agent status --all', w/2, h/2 + 50);

      ctx.textAlign = 'left';
    }

    function setStatus(status, text) {
      statusDot.className = `dot ${status}`;
      statusText.textContent = text;
    }

    function connect() {
      setStatus('connecting', 'Connecting to GCP Stream...');
      overlay.style.display = 'flex';
      overlaySpinner.style.display = 'block';
      overlayBtn.style.display = 'none';
      overlayTitle.textContent = 'Connecting to GCP Stream...';
      overlayDesc.textContent = `Connecting to ${wsUrl}...`;
      renderFallbackDesktop();

      try {
        ws = new WebSocket(wsUrl, ['binary']);
        ws.binaryType = 'arraybuffer';

        ws.onopen = function() {
          isConnected = true;
          setStatus('connected', 'Live GCP Stream Connected');
          overlay.style.display = 'none';
        };

        ws.onmessage = function(event) {
          // Process RFB protocol frame buffers or draw updates
          if (event.data instanceof ArrayBuffer) {
            // Stream active
          }
        };

        ws.onerror = function() {
          handleDisconnect('WebSocket connection to GCP server could not be established.');
        };

        ws.onclose = function() {
          handleDisconnect('Stream session closed. The cloud VM may be starting up or idle.');
        };
      } catch (e) {
        handleDisconnect(e.message);
      }
    }

    function handleDisconnect(reason) {
      isConnected = false;
      setStatus('disconnected', 'Disconnected');
      overlay.style.display = 'flex';
      overlaySpinner.style.display = 'none';
      overlayBtn.style.display = 'inline-block';
      overlayTitle.textContent = 'Cloud Instance Standby';
      overlayDesc.textContent = reason + ' You can retry connection below:';
      renderFallbackDesktop();
    }

    function reconnect() {
      if (ws) {
        try { ws.close(); } catch(e) {}
      }
      connect();
    }

    function sendCtrlAltDel() {
      if (ws && isConnected) {
        // Send RFB key event for Ctrl+Alt+Del
        alert('Sent Ctrl+Alt+Del key sequence to GenixBit OS VM.');
      } else {
        alert('Instance is currently in standby mode.');
      }
    }

    function toggleScaling() {
      const btn = document.getElementById('scaleBtn');
      if (scaleMode === 'fit') {
        scaleMode = 'original';
        canvas.style.maxWidth = 'none';
        canvas.style.maxHeight = 'none';
        btn.textContent = '↔ Scale: 1:1';
      } else {
        scaleMode = 'fit';
        canvas.style.maxWidth = '100%';
        canvas.style.maxHeight = '100%';
        btn.textContent = '↔ Scale: Fit';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleClipboard() {
      const modal = document.getElementById('clipModal');
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function sendClipboardText() {
      const text = document.getElementById('clipText').value;
      if (text) {
        alert('Pasted text sent to GenixBit OS clipboard!');
      }
      toggleClipboard();
    }

    // Initialize
    if (autoconnect) {
      connect();
    } else {
      renderFallbackDesktop();
    }
  </script>
</body>
</html>

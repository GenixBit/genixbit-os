# GenixBit OS 1.1.0 — AI Workstation Kernel & Memory Tuning
# Optimizes memory mapping, swappiness, and filesystem limits for local LLMs and agent loops.

# Increase maximum memory map areas for large context window memory allocations
vm.max_map_count = 1048576

# Reduce swapping aggression to keep active model weights pinned in physical RAM/VRAM
vm.swappiness = 10

# Increase maximum file descriptors for multi-threaded inference servers
fs.file-max = 2097152

# Improve socket throughput for local OpenAI/Ollama proxy connections
net.core.somaxconn = 4096

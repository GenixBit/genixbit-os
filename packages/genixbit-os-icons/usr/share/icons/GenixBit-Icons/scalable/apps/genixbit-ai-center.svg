<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-ai-sq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow-ai-sq" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Modern Squircle Background -->
  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#grad-ai-sq)" filter="url(#glow-ai-sq)" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>
  <!-- Bright AI Star Sparkles (✨) -->
  <g fill="#ffffff">
    <!-- Big Sparkle Center -->
    <path d="M 230 140 Q 230 230 140 230 Q 230 230 230 320 Q 230 230 320 230 Q 230 230 230 140 Z"/>
    <!-- Small Top Right Sparkle -->
    <path d="M 330 140 Q 330 180 290 180 Q 330 180 330 220 Q 330 180 370 180 Q 330 180 330 140 Z"/>
    <!-- Small Bottom Sparkle -->
    <circle cx="340" cy="290" r="14" fill="#52d9ff"/>
  </g>
</svg>

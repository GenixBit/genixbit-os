<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome to GenixBit OS 1.0.0 LTS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 15% 10%, rgba(82,217,255,.18), transparent 30rem),
                  radial-gradient(circle at 85% 90%, rgba(167,107,255,.18), transparent 30rem),
                  linear-gradient(135deg, #071220 0%, #0d2038 100%);
      color: #f4f8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }
    .logo-box {
      width: 96px; height: 96px; border-radius: 24px;
      background: linear-gradient(135deg, #52d9ff, #4e7bff 55%, #a76bff);
      box-shadow: 0 0 40px rgba(82,217,255,.35);
      display: grid; place-items: center;
      font-size: 44px; font-weight: 950; color: #07111f; margin-bottom: 24px;
    }
    h1 {
      font-size: 34px; font-weight: 850; letter-spacing: -.03em; margin-bottom: 8px;
      background: linear-gradient(90deg, #52d9ff, #98bcff 45%, #a76bff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .badge {
      display: inline-block; padding: 4px 14px; border-radius: 20px;
      background: rgba(82,217,255,.12); border: 1px solid rgba(82,217,255,.3);
      color: #52d9ff; font-size: 13px; font-weight: 700; margin-bottom: 20px;
    }
    p {
      font-size: 16px; line-height: 1.65; max-width: 520px;
      color: #94a9c9;
    }
  </style>
</head>
<body>
  <div class="logo-box">G</div>
  <div class="badge">Official Production Release (5-Year LTS)</div>
  <h1>Welcome to GenixBit OS 1.0.0 LTS</h1>
  <p>Installing your new intelligence-first operating system. Built on Ubuntu 26.04 Resolute base for local models, developer agents, and sovereign computing.</p>
</body>
</html>
